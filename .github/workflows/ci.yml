name: Controlli
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:bridge
      - run: npm run bridge:simulate
      - run: npm run build
