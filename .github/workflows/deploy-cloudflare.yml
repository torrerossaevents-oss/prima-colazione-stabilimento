name: Pubblica su Cloudflare
# Avvio solo manuale (Actions → «Pubblica su Cloudflare» → Run workflow), dopo i controlli.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-cloudflare
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment: cloudflare
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Migrazioni e pubblicazione
        run: node scripts/cloudflare-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_CUSTOM_DOMAIN: ${{ vars.CF_CUSTOM_DOMAIN }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
